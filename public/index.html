<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ED Mobility – Missionsplaner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>Welche Mission lohnt sich?</h1>
        <p class="intro">Die Demo plant aus mehreren Opportunities eine mehrstufige Mission. Die Daten stammen aus der reproduzierbaren Demo-Welt des Optimizers.</p>
      </header>

      <section class="panel controls" aria-labelledby="controls-title">
        <div>
          <h2 id="controls-title">Optimierung starten</h2>
        </div>
        <label>Optimierungsmodus
          <select id="mode">
            <option value="MAX_REVENUE">Maximaler Umsatz</option>
            <option value="MAX_REVENUE_PER_HOUR">Umsatz pro Stunde</option>
            <option value="MAX_ESTIMATED_SURPLUS">Geschätzter Überschuss</option>
            <option value="BALANCED">Ausgewogen</option>
            <option value="DESTINATION">Ziel Berlin</option>
          </select>
        </label>
        <label>Risikoprofil
          <select id="risk">
            <option value="SAFE">Sicher</option>
            <option value="NORMAL" selected>Normal</option>
            <option value="AGGRESSIVE">Aggressiv</option>
          </select>
        </label>
        <button id="run" type="button">Missionen berechnen</button>
      </section>

      <section id="status" class="status" role="status">Bereit für die Demo-Welt.</section>
      <section id="results" class="results" aria-live="polite"></section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
